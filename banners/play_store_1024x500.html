<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1024px; height: 500px; overflow: hidden; font-family: 'Inter', sans-serif; }
  .container {
    width: 1024px; height: 500px;
    background: linear-gradient(135deg, #0f0002 0%, #2a0009 35%, #ba001c 100%);
    display: flex; align-items: center; position: relative; overflow: hidden;
  }
  .glow {
    position: absolute; width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,210,0,0.12) 0%, transparent 70%);
    right: 100px; top: -100px;
  }
  .line-left {
    position: absolute; left: 80px; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg, transparent, rgba(255,210,0,0.3), transparent);
  }
  .content {
    display: flex; align-items: center; gap: 60px;
    padding: 0 120px; position: relative; z-index: 2; width: 100%;
  }
  .text-side { flex: 1; }
  .brand { font-size: 14px; font-weight: 900; color: rgba(255,255,255,0.3); letter-spacing: 5px; text-transform: uppercase; margin-bottom: 20px; }
  .brand span { color: #ffd200; }
  .title {
    font-size: 52px; font-weight: 900; color: #fff; line-height: 1.1;
    letter-spacing: -2px; margin-bottom: 12px;
  }
  .title .gold { color: #ffd200; }
  .sub { font-size: 16px; color: rgba(255,255,255,0.35); font-weight: 500; }
  .icons-side { display: flex; flex-direction: column; gap: 10px; }
  .icon-row { display: flex; gap: 10px; }
  .icon-box {
    width: 64px; height: 64px; border-radius: 16px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: center; font-size: 28px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="glow"></div>
  <div class="line-left"></div>
  <div class="content">
    <div class="text-side">
      <div class="brand"><span>M</span>IIAM</div>
      <div class="title">Everything<br>Delivered <span class="gold">Fast.</span></div>
      <div class="sub">Food &bull; Grocery &bull; Pharmacy &bull; Flowers &bull; Services</div>
    </div>
    <div class="icons-side">
      <div class="icon-row">
        <div class="icon-box">🍔</div>
        <div class="icon-box">🛒</div>
        <div class="icon-box">💊</div>
      </div>
      <div class="icon-row">
        <div class="icon-box">💐</div>
        <div class="icon-box">🔧</div>
        <div class="icon-box">💇</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
