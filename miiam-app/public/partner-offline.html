<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — MIIAM Partner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossOrigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <style>
    :root {
      --bg: #fff4f4;
      --surface: #ffffff;
      --text: #4d212a;
      --text-secondary: #814c55;
      --primary: #ba001c;
      --outline: #e8e0e0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1214;
        --surface: #2a1f22;
        --text: #f5e6e8;
        --text-secondary: #c8a8ad;
        --primary: #ff6b8a;
        --outline: #3d3033;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      text-align: center;
      max-width: 380px;
      background: var(--surface);
      border-radius: 24px;
      padding: 48px 32px 40px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    @media (prefers-color-scheme: dark) {
      .card { box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
    }
    .icon-wrap {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: rgba(186, 0, 28, 0.08);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }
    @media (prefers-color-scheme: dark) {
      .icon-wrap { background: rgba(255, 107, 138, 0.12); }
    }
    .icon-wrap .material-symbols-outlined {
      font-size: 40px;
      color: var(--primary);
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 40;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .tips {
      text-align: left;
      margin-bottom: 32px;
    }
    .tip {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 0;
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.4;
    }
    .tip .material-symbols-outlined {
      font-size: 18px;
      color: var(--primary);
      margin-top: 1px;
      flex-shrink: 0;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      border: none;
      padding: 14px 24px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      width: 100%;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-secondary {
      background: transparent;
      color: var(--text-secondary);
      border: 1.5px solid var(--outline);
    }
    .brand {
      margin-top: 24px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-secondary);
      opacity: 0.5;
    }
    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <span class="material-symbols-outlined">wifi_off</span>
    </div>
    <h1>You're Offline</h1>
    <p class="subtitle">No internet connection detected. Cached data is still available.</p>

    <div class="tips">
      <div class="tip">
        <span class="material-symbols-outlined">check_circle</span>
        <span>You can view cached orders, menu, and KOT</span>
      </div>
      <div class="tip">
        <span class="material-symbols-outlined">info</span>
        <span>New orders will sync when you're back online</span>
      </div>
      <div class="tip">
        <span class="material-symbols-outlined">tips_and_updates</span>
        <span>Check your Wi-Fi or mobile data connection</span>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" onclick="window.location.reload()">
        <span class="material-symbols-outlined" style="font-size:18px;vertical-align:middle;margin-right:6px">refresh</span>
        Try Again
      </button>
      <button class="btn btn-secondary" onclick="window.location.href='/partner/dashboard'">
        Go to Dashboard
      </button>
    </div>

    <div class="brand">MIIAM Partner</div>
  </div>
</body>
</html>
