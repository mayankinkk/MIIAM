<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 600px; overflow: hidden; font-family: 'Inter', sans-serif; }
  .container {
    width: 1920px; height: 600px;
    background: linear-gradient(135deg, #0f0002 0%, #2a0009 35%, #6b0014 65%, #ba001c 100%);
    display: flex; align-items: center; position: relative; overflow: hidden;
  }
  .glow {
    position: absolute; width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,45,74,0.3) 0%, transparent 65%);
    right: 300px; top: -100px;
  }
  .glow2 {
    position: absolute; width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,210,0,0.15) 0%, transparent 65%);
    left: 100px; bottom: -200px;
  }
  .grid-bg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .line-accent {
    position: absolute; left: 120px; top: 0; bottom: 0; width: 4px;
    background: linear-gradient(180deg, transparent, #ffd200, transparent);
  }
  .content {
    position: relative; z-index: 2;
    padding: 0 160px; display: flex; align-items: center; gap: 80px;
  }
  .text-side { flex: 1; }
  .brand { font-size: 18px; font-weight: 900; color: rgba(255,255,255,0.4); letter-spacing: 6px; text-transform: uppercase; margin-bottom: 24px; }
  .brand span { color: #ffd200; }
  .title {
    font-size: 72px; font-weight: 900; color: #fff; line-height: 1.05;
    letter-spacing: -3px; margin-bottom: 20px;
  }
  .title .accent { color: #ffd200; }
  .sub {
    font-size: 22px; color: rgba(255,255,255,0.45); font-weight: 500;
    letter-spacing: 0.5px;
  }
  .icons-side {
    display: flex; flex-direction: column; gap: 14px;
  }
  .icon-row { display: flex; gap: 14px; }
  .icon-box {
    width: 90px; height: 90px; border-radius: 22px; display: flex;
    align-items: center; justify-content: center; font-size: 38px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
  }
</style>
</head>
<body>
<div class="container">
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="grid-bg"></div>
  <div class="line-accent"></div>
  <div class="content">
    <div class="text-side">
      <div class="brand"><span>M</span>IIAM</div>
      <div class="title">Everything<br>Delivered <span class="accent">Fast.</span></div>
      <div class="sub">Food &bull; Grocery &bull; Pharmacy &bull; Flowers &bull; Services</div>
    </div>
    <div class="icons-side">
      <div class="icon-row">
        <div class="icon-box">🍔</div>
        <div class="icon-box">🛒</div>
        <div class="icon-box">💊</div>
      </div>
      <div class="icon-row">
        <div class="icon-box">💐</div>
        <div class="icon-box">🔧</div>
        <div class="icon-box">💇</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
