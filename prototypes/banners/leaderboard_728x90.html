<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 728px; height: 90px; overflow: hidden; font-family: 'Inter', sans-serif; }
  .container {
    width: 728px; height: 90px;
    background: linear-gradient(90deg, #0f0002, #2a0009, #ba001c);
    display: flex; align-items: center; position: relative; overflow: hidden;
  }
  .line { position: absolute; left: 140px; top: 0; bottom: 0; width: 2px; background: rgba(255,210,0,0.4); }
  .logo-area {
    width: 140px; display: flex; align-items: center; justify-content: center;
    position: relative; z-index: 2;
  }
  .logo { font-size: 22px; font-weight: 900; color: #fff; letter-spacing: -1px; }
  .logo span { color: #ffd200; }
  .text-area {
    flex: 1; padding: 0 30px; position: relative; z-index: 2;
  }
  .headline { font-size: 22px; font-weight: 900; color: #fff; letter-spacing: -0.5px; }
  .headline .gold { color: #ffd200; }
  .dots {
    display: flex; gap: 6px; margin-left: auto; padding-right: 30px;
    position: relative; z-index: 2;
  }
  .dot { width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <div class="line"></div>
  <div class="logo-area">
    <div class="logo">MII<span>A</span>M</div>
  </div>
  <div class="text-area">
    <div class="headline">Food &bull; Grocery &bull; Pharmacy &bull; <span class="gold">Everything.</span></div>
  </div>
  <div class="dots">
    <div class="dot">🍔</div>
    <div class="dot">🛒</div>
    <div class="dot">💊</div>
  </div>
</div>
</body>
</html>
