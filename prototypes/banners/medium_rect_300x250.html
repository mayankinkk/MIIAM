<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 300px; height: 250px; overflow: hidden; font-family: 'Inter', sans-serif; }
  .container {
    width: 300px; height: 250px;
    background: linear-gradient(145deg, #0f0002 0%, #2a0009 40%, #ba001c 100%);
    display: flex; flex-direction: column; justify-content: center;
    padding: 30px; position: relative; overflow: hidden;
  }
  .glow {
    position: absolute; width: 250px; height: 250px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,210,0,0.15) 0%, transparent 70%);
    bottom: -80px; right: -60px;
  }
  .accent-line {
    position: absolute; left: 0; top: 50%; width: 40px; height: 3px;
    background: #ffd200;
  }
  .brand { font-size: 12px; font-weight: 900; color: rgba(255,255,255,0.35); letter-spacing: 4px; text-transform: uppercase; margin-bottom: 16px; }
  .title { font-size: 28px; font-weight: 900; color: #fff; line-height: 1.15; letter-spacing: -1px; margin-bottom: 12px; }
  .title .gold { color: #ffd200; }
  .icons { display: flex; gap: 6px; }
  .icon { width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center; font-size: 16px; }
</style>
</head>
<body>
<div class="container">
  <div class="glow"></div>
  <div class="accent-line"></div>
  <div class="brand"><span style="color:#ffd200">M</span>IIAM</div>
  <div class="title">One App.<br><span class="gold">Everything</span> Delivered.</div>
  <div class="icons">
    <div class="icon">🍔</div>
    <div class="icon">🛒</div>
    <div class="icon">💊</div>
    <div class="icon">💐</div>
    <div class="icon">🔧</div>
  </div>
</div>
</body>
</html>
