<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Inter', sans-serif; }
  .container {
    width: 1080px; height: 1080px;
    background: linear-gradient(135deg, #1a0005 0%, #3d0010 30%, #ba001c 70%, #ff2d4a 100%);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    position: relative; overflow: hidden;
  }
  .bg-circle1 {
    position: absolute; width: 600px; height: 600px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,45,74,0.3) 0%, transparent 70%);
    top: -100px; right: -100px;
  }
  .bg-circle2 {
    position: absolute; width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(186,0,28,0.4) 0%, transparent 70%);
    bottom: -150px; left: -100px;
  }
  .bg-dots {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 30px 30px;
  }
  .content { position: relative; z-index: 2; text-align: center; padding: 0 80px; }
  .badge {
    display: inline-block; padding: 10px 28px; border-radius: 50px;
    background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
    color: #ffd200; font-size: 18px; font-weight: 700; letter-spacing: 3px;
    text-transform: uppercase; margin-bottom: 40px;
    border: 1px solid rgba(255,210,0,0.3);
  }
  .logo {
    font-size: 120px; font-weight: 900; color: #fff;
    letter-spacing: -4px; line-height: 1; margin-bottom: 10px;
  }
  .logo span { color: #ffd200; }
  .tagline {
    font-size: 32px; color: rgba(255,255,255,0.9); font-weight: 600;
    line-height: 1.4; margin-bottom: 50px;
  }
  .services {
    display: flex; gap: 24px; justify-content: center; margin-bottom: 50px;
  }
  .service-pill {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 24px; border-radius: 14px;
    background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
    color: #fff; font-size: 18px; font-weight: 600;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .service-pill .icon { font-size: 22px; }
  .cta {
    display: inline-block; padding: 18px 50px; border-radius: 60px;
    background: #fff; color: #ba001c; font-size: 22px; font-weight: 900;
    letter-spacing: 1px; text-transform: uppercase;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .bottom-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 30px 80px;
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(0,0,0,0.2); backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .bottom-bar span { color: rgba(255,255,255,0.7); font-size: 16px; font-weight: 600; }
  .bottom-bar .url { color: #ffd200; font-weight: 700; }
</style>
</head>
<body>
<div class="container">
  <div class="bg-circle1"></div>
  <div class="bg-circle2"></div>
  <div class="bg-dots"></div>
  <div class="content">
    <div class="badge">Now Live</div>
    <div class="logo">MII<span>A</span>M</div>
    <div class="tagline">Everything you need.<br>Delivered to your doorstep.</div>
    <div class="services">
      <div class="service-pill"><span class="icon">🍔</span> Food</div>
      <div class="service-pill"><span class="icon">🛒</span> Grocery</div>
      <div class="service-pill"><span class="icon">💊</span> Pharmacy</div>
      <div class="service-pill"><span class="icon">💐</span> Flowers</div>
      <div class="service-pill"><span class="icon">🔧</span> Services</div>
    </div>
    <div class="cta">Order Now</div>
  </div>
  <div class="bottom-bar">
    <span>Download on iOS & Android</span>
    <span class="url">miiam.in</span>
  </div>
</div>
</body>
</html>
