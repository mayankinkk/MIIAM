<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Inter', sans-serif; }
  .container {
    width: 1080px; height: 1080px;
    background: #0a0a0a;
    display: flex; flex-direction: column; position: relative; overflow: hidden;
  }
  .glow-tl {
    position: absolute; width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(186,0,28,0.4) 0%, transparent 70%);
    top: -150px; left: -100px;
  }
  .glow-br {
    position: absolute; width: 600px; height: 600px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,210,0,0.2) 0%, transparent 70%);
    bottom: -200px; right: -100px;
  }
  .content { position: relative; z-index: 2; padding: 60px 70px; height: 100%; display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 50px; }
  .brand { font-size: 32px; font-weight: 900; color: #fff; letter-spacing: -1px; }
  .brand span { color: #ffd200; }
  .tag-pill {
    padding: 10px 24px; border-radius: 50px;
    border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.6);
    font-size: 14px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
  }
  .title {
    font-size: 52px; font-weight: 900; color: #fff;
    line-height: 1.15; margin-bottom: 40px; letter-spacing: -1px;
  }
  .title .red { color: #ff2d4a; }
  .title .gold { color: #ffd200; }
  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px; flex: 1;
  }
  .card {
    border-radius: 24px; padding: 36px;
    display: flex; flex-direction: column; justify-content: flex-end;
    position: relative; overflow: hidden;
  }
  .card-food { background: linear-gradient(135deg, #ba001c, #ff2d4a); }
  .card-grocery { background: linear-gradient(135deg, #0d7c5f, #38ef7d); }
  .card-pharmacy { background: linear-gradient(135deg, #6b21a8, #da22ff); }
  .card-services { background: linear-gradient(135deg, #0b50d5, #667eea); }
  .card .icon-bg {
    position: absolute; top: 20px; right: 20px; font-size: 80px; opacity: 0.25;
  }
  .card .label { font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.8); text-transform: uppercase; letter-spacing: 2px; }
  .card .name { font-size: 28px; font-weight: 900; color: #fff; margin-top: 8px; }
  .card .desc { font-size: 15px; color: rgba(255,255,255,0.7); margin-top: 6px; }
  .footer {
    margin-top: auto; padding-top: 30px;
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .footer-left { color: rgba(255,255,255,0.5); font-size: 16px; }
  .footer-right { color: #ffd200; font-size: 18px; font-weight: 700; }
</style>
</head>
<body>
<div class="container">
  <div class="glow-tl"></div>
  <div class="glow-br"></div>
  <div class="content">
    <div class="top">
      <div class="brand">MII<span>A</span>M</div>
      <div class="tag-pill">All-in-One App</div>
    </div>
    <div class="title">
      One App.<br>
      <span class="red">Food.</span> <span class="gold">Grocery.</span><br>
      Pharma. Services.
    </div>
    <div class="grid">
      <div class="card card-food">
        <div class="icon-bg">🍔</div>
        <div class="label">Delivers</div>
        <div class="name">Food</div>
        <div class="desc">From local restaurants</div>
      </div>
      <div class="card card-grocery">
        <div class="icon-bg">🛒</div>
        <div class="label">Delivers</div>
        <div class="name">Grocery</div>
        <div class="desc">Fresh & everyday needs</div>
      </div>
      <div class="card card-pharmacy">
        <div class="icon-bg">💊</div>
        <div class="label">Delivers</div>
        <div class="name">Pharmacy</div>
        <div class="desc">Medicines at your door</div>
      </div>
      <div class="card card-services">
        <div class="icon-bg">🔧</div>
        <div class="label">Provides</div>
        <div class="name">Services</div>
        <div class="desc">Home repairs & beauty</div>
      </div>
    </div>
    <div class="footer">
      <div class="footer-left">miiam.in</div>
      <div class="footer-right">Download Now</div>
    </div>
  </div>
</div>
</body>
</html>
