<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Inter', sans-serif; }
  .container {
    width: 1080px; height: 1080px;
    background: linear-gradient(135deg, #ffd200 0%, #f7971e 50%, #ff6a00 100%);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    position: relative; overflow: hidden; text-align: center;
  }
  .bg-pattern {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-image: radial-gradient(rgba(0,0,0,0.06) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .content { position: relative; z-index: 2; padding: 0 100px; }
  .icon-row {
    display: flex; gap: 16px; justify-content: center; margin-bottom: 40px;
  }
  .icon-circle {
    width: 70px; height: 70px; border-radius: 50%;
    background: rgba(255,255,255,0.3); display: flex;
    align-items: center; justify-content: center; font-size: 32px;
  }
  .title {
    font-size: 58px; font-weight: 900; color: #1a0005;
    line-height: 1.15; margin-bottom: 20px; letter-spacing: -2px;
  }
  .subtitle {
    font-size: 24px; color: rgba(26,0,5,0.7); font-weight: 500;
    line-height: 1.6; margin-bottom: 50px; max-width: 700px; margin-left: auto; margin-right: auto;
  }
  .perks {
    display: flex; gap: 20px; justify-content: center; margin-bottom: 50px;
  }
  .perk {
    padding: 20px 32px; border-radius: 20px;
    background: rgba(255,255,255,0.9); text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
  }
  .perk .emoji { font-size: 36px; margin-bottom: 8px; }
  .perk .text { font-size: 16px; font-weight: 700; color: #1a0005; }
  .cta-btn {
    display: inline-block; padding: 22px 60px; border-radius: 60px;
    background: #1a0005; color: #ffd200; font-size: 22px; font-weight: 900;
    letter-spacing: 1px; text-transform: uppercase;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .footer {
    position: absolute; bottom: 30px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 40px;
  }
  .footer span { font-size: 16px; font-weight: 600; color: rgba(26,0,5,0.5); }
</style>
</head>
<body>
<div class="container">
  <div class="bg-pattern"></div>
  <div class="content">
    <div class="icon-row">
      <div class="icon-circle">🏪</div>
      <div class="icon-circle">📈</div>
      <div class="icon-circle">🤝</div>
    </div>
    <div class="title">Partner With MIIAM</div>
    <div class="subtitle">Grow your business with India's fastest growing local delivery platform. Reach thousands of new customers.</div>
    <div class="perks">
      <div class="perk">
        <div class="emoji">🚀</div>
        <div class="text">Zero<br>Setup Fee</div>
      </div>
      <div class="perk">
        <div class="emoji">📊</div>
        <div class="text">Real-time<br>Analytics</div>
      </div>
      <div class="perk">
        <div class="emoji">💰</div>
        <div class="text">Fast<br>Payouts</div>
      </div>
      <div class="perk">
        <div class="emoji">🎯</div>
        <div class="text">Marketing<br>Support</div>
      </div>
    </div>
    <div class="cta-btn">Join as Partner</div>
  </div>
  <div class="footer">
    <span>miiam.in/partner</span>
    <span>|</span>
    <span>Contact us to get started</span>
  </div>
</div>
</body>
</html>
